openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Universal Gaming PC Agent Platform API
  version: 1.0.0
  summary: Authorized gaming-PC session control for independent booking applications.
  description: |
    HTTP contract for the Universal Gaming PC Agent Platform. Cloud and
    on-premise controllers keep these paths and schemas. This document is
    not a workstation lock and is not a production deployment.

    The server URL includes the base path `/api/v1`. Paths below are relative
    to that base. Cloud and on-premise deployments change `controllerHost`
    and keep these paths and schemas.

    `GET /health` reports whether the controller process is running. HTTP 200
    and `status: ok` do not mean a gaming PC is connected, a session is
    active, or access is locked.

    Session-changing responses distinguish controller acceptance from a
    confirmed device effect. Callers read `outcome`, `start_confirmed`,
    `lock_confirmed`, and `device_effect_confirmed`. HTTP 202 with
    `outcome: accepted` means the controller stored a command. Confirmed
    play is `start_confirmed: true`. A verified lock is `lock_confirmed: true`,
    which is set only from an authenticated enforcement result. Session
    status `ended` or `expired` does not by itself verify a lock.

    Identifiers, timestamps, and the enrollment token in the examples are
    fictional. Numeric timeouts in examples are provisional design examples
    from ADR-001, not production-approved security settings.
    `EXAMPLE_ONLY_NOT_A_REAL_SECRET` is not a credential.

    Normative lifecycle rules are in `contracts/session-lifecycle.md` and
    `contracts/device-lifecycle.md`. Security requirements are in
    `docs/security-model.md`.

    This document is the published integration contract. It lists only
    operations this controller process serves: GET /health, POST /devices,
    GET /devices, POST /sessions, GET /sessions/{session_id},
    POST /sessions/{session_id}/extend, POST /sessions/{session_id}/end,
    and POST /agents/heartbeat. Planned reads that are not served are in
    `api/future-endpoints.md`. Booking clients list devices and poll
    GET /sessions/{session_id}. Booking HTTP does not lock a PC. Confirmed
    play is start_confirmed. A verified lock is lock_confirmed.
servers:
  - url: https://{controllerHost}/api/v1
    description: One controller contract for cloud and on-premise deployments.
    variables:
      controllerHost:
        default: controller.example
        description: Deployment-specific controller hostname. Not a production endpoint.
tags:
  - name: Controller
    description: Controller process health. This does not report device, session, or lock state.
  - name: Devices
    description: Device registration and observed device status.
  - name: Sessions
    description: Authorized session requests. Acceptance is separate from confirmed play or lock.
  - name: Commands
    description: >
      Command objects are returned on session create, extend, and end.
      This contract does not include a command GET operation.
  - name: Agents
    description: Agent heartbeat, reported access state, and command exchange.
paths:
  /health:
    get:
      tags: [Controller]
      operationId: getHealth
      summary: Report whether the controller process is healthy
      description: |
        Checks this controller process only. HTTP 200 and status ok mean the
        process answered. They do not mean a gaming PC is connected, a session
        is active, or access is locked. This operation does not use booking
        or agent credentials.
      security: []
      responses:
        "200":
          description: The controller process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                healthy:
                  summary: Controller process is healthy
                  value:
                    status: ok
  /devices:
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register or provision a device
      description: |
        Creates a device record in the caller's account and returns a one-time
        enrollment token. This response does not contact the PC.

        The same Idempotency-Key and body return the original 201 response
        while the enrollment token is still retained. After that retention
        window the same key returns 409 enrollment_replay_unavailable and
        does not mint another token. The retention window is a working
        assumption in ADR-001.

        A different key that repeats an existing device external_reference
        in the account returns 409 external_reference_conflict with device_id
        in error.details. The Idempotency-Key is scoped to the authenticated
        account. Another account's use of the same key does not return this
        registration.
      security:
        - bookingOAuth2: [devices:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
            examples:
              registerStation:
                summary: Register a Windows station
                value:
                  display_name: Station 12
                  platform: windows
                  external_reference: station-12
      responses:
        "201":
          description: Device record created. The PC has not been contacted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistrationResult"
              examples:
                created:
                  $ref: "#/components/examples/DeviceRegistered"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List authorized devices
      description: Returns devices in the caller's account. The cursor is opaque.
      security:
        - bookingOAuth2: [devices:read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PlatformFilter"
        - $ref: "#/components/parameters/ConnectivityFilter"
      responses:
        "200":
          description: Devices visible to the caller. The list may be empty.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
              examples:
                oneDevice:
                  $ref: "#/components/examples/DeviceListExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Request a new authorized session
      description: |
        Authorizes a session and stores a start_session command.

        A successful first response is HTTP 202 with outcome accepted,
        session status accepted, and start_confirmed false. That is controller
        acceptance. The expires_at value is the authorized deadline. It is not
        evidence that play has started, and passing that time does not by
        itself confirm a lock.

        Poll GET /sessions/{session_id}. Play is
        confirmed only when start_confirmed is true. A retry uses the same
        Idempotency-Key and body and receives the current session together
        with its latest command. That replay may show effect_confirmed,
        effect_not_applied, or a replacement start command if the first
        command expired before the session deadline.

        A different key is rejected with 409 device_session_conflict when the
        device already has a non-terminal session. A different key whose
        external_reference matches a non-terminal session in the account is
        rejected with 409 external_reference_conflict, and error.details
        includes session_id.
      security:
        - bookingOAuth2: [sessions:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
            examples:
              startBooking:
                $ref: "#/components/examples/CreateSessionRequestExample"
      responses:
        "200":
          description: |
            Replay of an earlier create whose session is already terminal or
            whose start effect is already confirmed. Read outcome. This status
            is not used for the first acceptance.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandResult"
        "202":
          description: |
            The controller accepted the request and stored a start command.
            The device effect is unconfirmed. start_confirmed is false.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandResult"
              examples:
                accepted:
                  $ref: "#/components/examples/SessionStartAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /sessions/{session_id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Retrieve session state and expiry
      description: |
        Returns the controller's current session record. status accepted means
        the controller stored the session and play is unconfirmed. status
        active means start enforcement was verified. status ending means an
        explicit end was accepted and not yet executed. status ended means
        that end was executed. status expired means the authorized deadline
        was reached. status failed means start definitively failed. None of
        ended, expired, or failed implies lock_confirmed.
      security:
        - bookingOAuth2: [sessions:read]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Current session state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                active:
                  $ref: "#/components/examples/ActiveSession"
                ending:
                  $ref: "#/components/examples/EndingSession"
                expired:
                  $ref: "#/components/examples/ExpiredSession"
                endedWithoutLock:
                  $ref: "#/components/examples/EndedWithoutLock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /sessions/{session_id}/extend:
    post:
      tags: [Sessions]
      operationId: extendSession
      summary: Request an authorized session extension
      description: |
        Valid only when session status is active. The requested expires_at
        must be later than the current authorized expires_at.

        HTTP 202 outcome accepted stores an extend_session command and sets
        pending_expires_at. That response is not a completed extension.
        expires_at stays the previous deadline until a verified extend result
        is accepted at a controller time still before that deadline. A
        timeout, a rejection, or lost connectivity leaves the previous
        deadline in force. A second extend while one is pending, delivered,
        acknowledged, or executed returns 409 extension_in_progress unless
        the idempotency key matches the outstanding extend.
      security:
        - bookingOAuth2: [sessions:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendSessionRequest"
            examples:
              extendOneHour:
                summary: Request a later authorized deadline
                value:
                  expires_at: "2026-10-09T12:00:00Z"
      responses:
        "200":
          description: |
            Replay of an extend that has already reached a terminal command
            result. effect_confirmed means the new deadline is authorized.
            effect_not_applied means the extension failed and expires_at is
            unchanged.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandResult"
        "202":
          description: |
            Extension request stored. pending_expires_at holds the requested
            deadline. expires_at is still the previous authorized deadline.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandResult"
              examples:
                accepted:
                  $ref: "#/components/examples/SessionExtendAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /sessions/{session_id}/end:
    post:
      tags: [Sessions]
      operationId: endSession
      summary: Request early termination and locking
      description: |
        Asks the controller to end the session and have the agent lock the PC.

        When the session is active, or the start command was already delivered,
        the response is HTTP 202 outcome accepted, session status ending, and
        lock_confirmed false. A pending end_session command is stored. Status
        ended on a later read means that command was executed. lock_confirmed
        becomes true only when an authenticated result says OS enforcement
        succeeded.

        When the start command is still pending, the controller cancels that
        command and returns HTTP 200 outcome effect_not_applied with session
        status cancelled and lock_confirmed false. The start command was never
        offered to the agent.

        When the session is already ended, the response is HTTP 200 and returns
        the current end command. outcome is effect_confirmed only when
        lock_confirmed is true. A repeated end does not create a second end
        command.

        reason may be user_request or operator. deadline_reached is reserved
        for a command the controller creates when the authorization window
        elapses. An omitted body uses reason user_request.

        A start command whose status is expired was not delivered. That end
        cancels the session and does not store end_session. The returned
        command is that start command. A pending extend_session command is
        withdrawn when an end_session command is stored. pending_expires_at
        is cleared. lock_confirmed stays false.
      security:
        - bookingOAuth2: [sessions:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndSessionRequest"
            examples:
              userRequest:
                summary: Booking application requests termination
                value:
                  reason: user_request
      responses:
        "200":
          description: |
            The end request is already in a stored result. effect_confirmed
            means lock_confirmed is true. effect_not_applied covers a
            cancelled session, or an executed end whose lock is still
            unverified.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandResult"
              examples:
                cancelledBeforeDispatch:
                  $ref: "#/components/examples/SessionEndCancelledBeforeDispatch"
        "202":
          description: |
            End accepted. Session status is ending and lock_confirmed is false.
            The response does not mean the PC is locked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandResult"
              examples:
                accepted:
                  $ref: "#/components/examples/SessionEndAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /agents/heartbeat:
    post:
      tags: [Agents]
      operationId: submitAgentHeartbeat
      summary: Submit an agent heartbeat and reported status
      description: |
        Agent-only operation. The client certificate must match device_id.
        Booking credentials receive 403.

        The controller records freshness from its own receipt time. The agent
        reported_at must fall within the allowed clock skew or the request
        fails with 422 clock_skew and changes no state.

        command_results are applied before pending_commands is built. outcome
        recorded means the heartbeat was stored. Commands returned in
        pending_commands are not yet executed. The agent applies each
        command_id at most once. The same command may be offered again until
        a terminal result is stored.

        An invalid certificate may fail the TLS handshake before an HTTP
        status exists. A revoked device that still completes TLS receives 401.
      security:
        - agentMutualTls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
            examples:
              reportStart:
                $ref: "#/components/examples/HeartbeatReportStart"
      responses:
        "200":
          description: |
            Heartbeat stored. outcome is recorded. pending_commands are
            outstanding work, not confirmed execution.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
              examples:
                startRecorded:
                  $ref: "#/components/examples/HeartbeatStartRecorded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
components:
  headers:
    RequestId:
      description: |
        Identifier for this HTTP request. It matches error.request_id when
        the body is an error. When the caller sent a UUID in X-Request-Id,
        this value is that UUID. Otherwise the controller generates one.
      schema:
        $ref: "#/components/schemas/Uuid"
    RetryAfter:
      description: Minimum number of seconds the client waits before retrying.
      schema:
        type: integer
        minimum: 0
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Caller-generated key. A retry sends the same key and the same body.
        The same key with a different body returns 409 idempotency_conflict.
        A missing header returns 400 idempotency_key_required. A header that
        fails this schema returns 400 validation_error. Retention of the key
        is a provisional design example in ADR-001, not a production-approved
        security setting.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of devices to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as next_cursor. Callers do not invent cursors.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    PlatformFilter:
      name: platform
      in: query
      required: false
      description: Return only devices with this platform.
      schema:
        $ref: "#/components/schemas/Platform"
    ConnectivityFilter:
      name: connectivity
      in: query
      required: false
      description: Return only devices with this derived connectivity.
      schema:
        $ref: "#/components/schemas/Connectivity"
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Device identifier assigned by the controller.
      schema:
        $ref: "#/components/schemas/Uuid"
    SessionId:
      name: session_id
      in: path
      required: true
      description: Session identifier assigned by the controller.
      schema:
        $ref: "#/components/schemas/Uuid"
    CommandId:
      name: command_id
      in: path
      required: true
      description: Command identifier assigned by the controller.
      schema:
        $ref: "#/components/schemas/Uuid"
  securitySchemes:
    bookingOAuth2:
      type: oauth2
      description: |
        OAuth 2.0 client credentials for provisioning and booking clients.
        The controller validates the bearer access token with the issuer's
        JWKS: signature, issuer, audience, and expiry. The token URL is a
        placeholder, not a route of this service. account_id comes from the
        deployment-configured token claim. Callers do not send account_id.
        See docs/ADR-003-identity-provider.md.
      flows:
        clientCredentials:
          tokenUrl: https://controller.example/oauth/token
          scopes:
            devices:read: Read devices and device status in the caller's account.
            devices:write: Register a device in the caller's account.
            sessions:read: Read sessions in the caller's account.
            sessions:write: Create, extend, and end sessions in the caller's account.
            commands:read: Read commands in the caller's account.
    agentMutualTls:
      type: mutualTLS
      description: |
        Agent authentication. The client certificate must chain to the
        controller trust anchor and match a pre-provisioned fingerprint for
        one device_id. OAuth bearer tokens receive 403 on agent routes.
        Heartbeat storage is implemented. Command exchange is not.
  responses:
    BadRequest:
      description: |
        The JSON is malformed, a required idempotency key is missing, a value
        has the wrong type, an unknown field was sent, or a header failed
        schema validation. error.code is invalid_json, idempotency_key_required,
        or validation_error.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        The credential is missing, invalid, or revoked. error.code is
        unauthorized. An agent certificate may instead fail during the TLS
        handshake, in which case no HTTP response is produced.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The credential is valid and does not authorize this operation, or the
        agent certificate does not match device_id. error.code is forbidden
        or device_identity_mismatch.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        No resource in the caller's account matches the identifier.
        Identifiers that exist in another account also use this response,
        so the API does not reveal them. error.code is not_found,
        device_not_found, session_not_found, or command_not_found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The request is well formed and conflicts with stored state or with a
        previous use of the same Idempotency-Key. error.code identifies the
        conflict. See contracts/error-model.md.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: A body was sent with a media type other than application/json. error.code is unsupported_media_type.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: |
        The JSON types are valid and a semantic rule failed. Examples are a
        deadline that is not in the future, an extension that is not later
        than the current deadline, platform_not_available, and clock_skew.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StorageUnavailable:
      description: Device storage is unavailable. error.code is storage_unavailable. The response does not include database connection details.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: |
        The caller's account exceeded the deployment rate limit. error.code is
        rate_limited. Limits are per account_id and shared through PostgreSQL.
        Numeric values are deployment configuration. Retry-After is seconds
        until the current window ends. A stored Idempotency-Key replay does
        not consume a slot.
      headers:
        X-Request-Id:
